[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "receipts-evals"
version = "0.1.0"
requires-python = ">=3.12"
# receipts_common and contracts come from the shared environment (make setup); do not pin them here.
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
